name: Verify Aleph Connector package

on:
  pull_request:
    paths:
      - 'apps/mcp-server/**'
      - 'packages/**'
      - 'windows/connector-app/**'
      - 'windows/installer/**'
      - 'windows/scripts/**'
      - 'windows/connector/**'
      - 'windows/autocad-plugin/**'
      - 'windows/updater/**'
      - 'windows/contracts/**'
      - '.github/workflows/release-connector.yml'
      - '.github/workflows/test-connector-package.yml'
  workflow_dispatch:

jobs:
  package:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Package + validate client bundle
    runs-on: [self-hosted, windows, x64, aleph-windows-ci]
    defaults:
      run:
        shell: powershell
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Configure runner tool paths
        working-directory: .
        run: |
          $toolPaths = @(
            "C:\Users\PC\.bun\bin",
            "C:\Users\PC\.cargo\bin"
          )
          foreach ($p in $toolPaths) {
            if (Test-Path $p) {
              Add-Content $env:GITHUB_PATH $p
              Write-Host "Added to GITHUB_PATH: $p"
            }
          }

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
        continue-on-error: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true

      - name: Verify toolchain availability
        working-directory: .
        run: |
          where.exe bun
          bun --version
          where.exe cargo
          cargo --version
          where.exe dotnet
          dotnet --version

      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install workspace dependencies
        working-directory: .
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Root dependency installation failed.' }
          Push-Location windows/connector-app
          try {
            bun install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Connector dependency installation failed.' }
          } finally { Pop-Location }

      - name: Prepare local runtime and installer resources
        run: ./scripts/prepare-connector-package.ps1

      - name: Build local-first NSIS and MSI installers
        working-directory: windows/connector-app
        run: |
          bun run tauri:build
          if ($LASTEXITCODE -ne 0) { throw 'Tauri bundle failed.' }

      - name: Validate packaged Bridge and AutoCAD plugin
        run: ./scripts/Test-PackagedBundle.ps1 -PackageDir ./connector-app/src-tauri/binaries/client -AllowMissingConnector

      - name: Upload unsigned preview installers
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-connector-installers
          path: |
            windows/connector-app/src-tauri/target/release/bundle/nsis/*.exe
            windows/connector-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Test Bridge packaging contracts
        run: dotnet test connector.Tests/CadAI.Bridge.Tests.csproj -c Release --nologo --filter FullyQualifiedName~UpdateChannelContractTests

      - name: Test Tauri Rust backend and update contracts
        working-directory: windows/connector-app/src-tauri
        run: |
          cargo test -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }
