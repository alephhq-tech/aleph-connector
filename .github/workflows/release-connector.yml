name: Publish local-first Windows installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version matching the checked-in Connector, Bridge and AutoCAD plugin versions'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, windows, x64, aleph-windows-ci]
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      AUTOCAD_NETFX_REF_DIR: ${{ secrets.AUTOCAD_NETFX_REF_DIR_WINDOWS }}
      UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure runner tool paths
        shell: powershell
        run: |
          $toolPaths = @(
            "C:\Users\PC\.bun\bin",
            "C:\Users\PC\.cargo\bin"
          )
          foreach ($p in $toolPaths) {
            if (Test-Path $p) {
              Add-Content $env:GITHUB_PATH $p
              Write-Host "Added to GITHUB_PATH: $p"
            }
          }

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
        continue-on-error: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true

      - name: Verify toolchain availability
        shell: powershell
        run: |
          where.exe bun
          bun --version
          where.exe cargo
          cargo --version
          where.exe dotnet
          dotnet --version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build, validate and sign release assets
        shell: powershell
        run: |
          ./windows/scripts/build-github-release.ps1 -Version $env:RELEASE_VERSION -OutputDir "$env:RUNNER_TEMP/connector-release"
      - uses: actions/upload-artifact@v4
        with:
          name: connector-release
          path: ${{ runner.temp }}/connector-release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: [self-hosted, windows, x64, aleph-windows-ci]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: connector-release
          path: release
      - name: Publish immutable GitHub release
        shell: powershell
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Releases must be built from main.' }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $assets = @(Get-ChildItem -LiteralPath release -File | Sort-Object Name | ForEach-Object FullName)
          if ($assets.Count -eq 0) { throw 'No release assets found.' }
          $tag = "v$env:RELEASE_VERSION"
          gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create a new immutable release tag.' }
          gh release create $tag @assets --repo "$env:GITHUB_REPOSITORY" --title "Aleph Connector $env:RELEASE_VERSION" --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
